<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rack">
<meta name="theme-color" content="#0E1013">
<title>Rack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0E1013;
    --surface: #171A1F;
    --surface-2: #1E2228;
    --line: #2A2F36;
    --line-soft: #21262C;
    --chalk: #F2F0EA;
    --muted: #7E858E;
    --dim: #565C64;
    --iron: #F0562A;
    --tape: #D6E04F;
    --sky: #4FA9DC;
    --violet: #B07BE0;
    --green: #5BC98C;
    --danger-bd: #4A2622;
    --danger-fg: #E0705A;
    --danger-bg: #241614;
    --toast-fg: #12140C;
    --r: 12px;
    --r-sm: 8px;
  }
  html[data-theme="light"]{
    --bg: #FAF8F4;
    --surface: #FFFFFF;
    --surface-2: #F0EDE6;
    --line: #DFDACE;
    --line-soft: #EAE6DC;
    --chalk: #23262B;
    --muted: #6E7480;
    --dim: #9AA0A9;
    --iron: #E04A18;
    --tape: #7E8A0E;
    --sky: #2B7FB2;
    --violet: #7B45B8;
    --green: #2A9159;
    --danger-bd: #EFC3B9;
    --danger-fg: #C0432A;
    --danger-bg: #FBEDE9;
    --toast-fg: #FFFFFF;
    --shadow: 0 1px 2px rgba(35,38,43,.05), 0 3px 10px rgba(35,38,43,.05);
  }
  html[data-theme="light"] .card,
  html[data-theme="light"] .split-tile,
  html[data-theme="light"] .ex-row,
  html[data-theme="light"] .manage-row,
  html[data-theme="light"] .stat{
    box-shadow: var(--shadow);
  }
  html[data-theme="light"] .tabbar{
    box-shadow: 0 -1px 3px rgba(35,38,43,.06);
  }
  html[data-theme="light"] .icon-btn{
    box-shadow: 0 1px 2px rgba(35,38,43,.06);
  }
  html[data-theme="light"] .field input,
  html[data-theme="light"] .field select,
  html[data-theme="light"] textarea.note-in{
    background: #FBF9F6;
  }
  html[data-theme="light"] .bar-track{ background:#EAE6DC; }
  html[data-theme="light"] .toast{ box-shadow:0 8px 24px rgba(35,38,43,.18); }
  html[data-theme="light"] .split-tile:active{ box-shadow:0 1px 2px rgba(35,38,43,.05); }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--chalk);
    font-family:'Inter', -apple-system, sans-serif;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    transition:background .2s, color .2s;
  }
  .app{
    max-width:540px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-top:env(safe-area-inset-top);
    padding-bottom:calc(74px + env(safe-area-inset-bottom));
  }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 20px 18px; gap:12px;
    position:sticky; top:0;
    background:var(--bg);
    z-index:20;
  }
  .topbar-left{ display:flex; align-items:center; gap:12px; min-width:0; }
  .icon-btn{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--chalk);
    width:38px; height:38px; border-radius:50%;
    font-size:17px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; transition:transform .12s, background .12s;
  }
  .icon-btn:active{ background:var(--surface-2); transform:scale(.94); }
  .icon-btn.hidden{ display:none; }
  .titles{ min-width:0; }
  .titles h1{
    font-family:'Bebas Neue', sans-serif;
    font-size:30px; letter-spacing:0.8px;
    margin:0; font-weight:400; line-height:1.05;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .titles .sub{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px; color:var(--dim);
    margin-top:3px; letter-spacing:0.3px;
  }

  main{ flex:1; padding:4px 20px 20px; }
  .view{ display:none; animation:fade .18s ease; }
  .view.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  /* TABBAR */
  .tabbar{
    position:fixed; bottom:0; left:0; right:0;
    background:var(--surface);
    border-top:1px solid var(--line-soft);
    display:flex;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    z-index:50;
  }
  .tabbar-inner{ max-width:540px; margin:0 auto; width:100%; display:flex; }
  .tab{
    flex:1; background:none; border:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:6px 0; color:var(--dim);
    transition:color .14s;
  }
  .tab .ico{ font-size:18px; line-height:1; }
  .tab .lb{
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px; letter-spacing:0.5px;
  }
  .tab.on{ color:var(--iron); }

  /* TILES */
  .split-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .split-tile{
    position:relative; background:var(--surface);
    border:1px solid var(--line-soft); border-radius:var(--r);
    padding:20px 16px 18px; cursor:pointer; min-height:118px;
    display:flex; flex-direction:column; justify-content:space-between;
    overflow:hidden; transition:transform .12s, border-color .12s;
  }
  .split-tile:active{ transform:scale(.975); border-color:var(--line); }
  .split-tile::before{
    content:''; position:absolute; inset:0 auto 0 0;
    width:3px; background:var(--accent, var(--iron));
  }
  .split-tile .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--accent, var(--iron)); opacity:.9;
  }
  .split-tile .name{
    font-family:'Bebas Neue', sans-serif;
    font-size:25px; letter-spacing:0.6px; line-height:1.1;
  }
  .split-tile .count{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px; color:var(--dim); margin-top:3px;
  }
  .add-tile{
    background:transparent; border:1px dashed var(--line);
    border-radius:var(--r); min-height:118px;
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:6px; cursor:pointer; color:var(--dim);
    transition:border-color .12s, color .12s;
  }
  .add-tile:active{ border-color:var(--muted); color:var(--muted); }
  .add-tile .plus{ font-size:22px; line-height:1; }
  .add-tile .lbl{ font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.4px; }

  .ex-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:14px; background:var(--surface);
    border:1px solid var(--line-soft); border-radius:var(--r-sm);
    margin-bottom:8px; cursor:pointer;
    transition:transform .1s, border-color .12s;
  }
  .ex-row:active{ transform:scale(.985); border-color:var(--line); }
  .ex-row .name{ font-size:15px; font-weight:500; min-width:0; }
  .ex-row .tag{
    font-family:'JetBrains Mono', monospace;
    font-size:9px; color:var(--dim); margin-top:3px; letter-spacing:0.4px;
  }
  .ex-row .right{ display:flex; align-items:center; gap:9px; flex-shrink:0; }
  .ex-row .last{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px; color:var(--muted); text-align:right;
  }
  .ex-row .last .none{ color:var(--dim); }
  .ex-row .chev{ color:var(--dim); font-size:15px; }
  .empty-note{
    color:var(--dim); font-size:13.5px;
    padding:24px 4px; text-align:center; line-height:1.6;
  }

  .card{
    background:var(--surface); border:1px solid var(--line-soft);
    border-radius:var(--r); padding:18px; margin-bottom:14px;
  }
  .card .label{
    font-family:'JetBrains Mono', monospace;
    font-size:10px; color:var(--dim);
    letter-spacing:0.5px; margin-bottom:14px;
  }
  .field-row{ display:grid; gap:9px; margin-bottom:14px; }
  .field-row.c1{ grid-template-columns:1fr; }
  .field-row.c2{ grid-template-columns:1fr 1fr; }
  .field-row.c3{ grid-template-columns:1fr 1fr 1fr; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px; color:var(--dim); letter-spacing:0.4px;
  }
  .field input, .field select{
    background:var(--bg); border:1px solid var(--line);
    color:var(--chalk); font-family:'JetBrains Mono', monospace;
    font-size:15px; padding:11px 10px; border-radius:var(--r-sm);
    width:100%; appearance:none; transition:border-color .12s;
  }
  .field input[type="number"]{ font-size:18px; }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--iron); }
  .field select{
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%237E858E' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat:no-repeat; background-position:right 12px center; padding-right:30px;
  }
  .hint{
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px; color:var(--dim);
    margin-top:-6px; margin-bottom:14px; line-height:1.6;
  }

  .btn{
    width:100%; border:none; padding:14px;
    font-family:'Bebas Neue', sans-serif;
    font-size:17px; letter-spacing:0.8px;
    border-radius:var(--r-sm); cursor:pointer;
    transition:transform .1s, opacity .12s;
  }
  .btn:active{ transform:scale(.985); }
  .btn-primary{ background:var(--iron); color:#FFF; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--muted); }
  .btn-danger{ background:transparent; border:1px solid var(--danger-bd); color:var(--danger-fg); }

  .sec-title{
    font-family:'JetBrains Mono', monospace;
    font-size:10px; color:var(--dim);
    letter-spacing:0.5px; margin:22px 0 10px 2px;
  }
  .hist-row{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:10px; padding:12px 2px;
    border-bottom:1px solid var(--line-soft); font-size:14px;
  }
  .hist-row:last-child{ border-bottom:none; }
  .hist-row .date{ color:var(--muted); font-family:'JetBrains Mono', monospace; font-size:11.5px; }
  .hist-row .stats{ font-family:'JetBrains Mono', monospace; font-size:13px; }
  .hist-left{ min-width:0; display:flex; flex-direction:column; gap:3px; }
  .hist-right{ display:flex; align-items:center; gap:9px; flex-shrink:0; }
  .hist-note{
    font-size:12px; color:var(--muted); line-height:1.5;
    margin-top:2px; word-break:break-word;
  }
  .pb{
    display:inline-block; vertical-align:middle;
    background:var(--tape); color:var(--toast-fg);
    font-family:'JetBrains Mono', monospace; font-size:8.5px;
    font-weight:700; letter-spacing:0.5px;
    padding:2px 6px; border-radius:100px; margin-left:7px;
  }
  .edit-dot{
    background:transparent; border:1px solid var(--line);
    color:var(--dim); border-radius:6px; padding:5px 9px;
    font-family:'JetBrains Mono', monospace; font-size:10px;
    cursor:pointer; flex-shrink:0;
  }
  .edit-dot:active{ background:var(--surface-2); }
  textarea.note-in{
    background:var(--bg); border:1px solid var(--line);
    color:var(--chalk); font-family:'Inter', sans-serif;
    font-size:14px; padding:10px; border-radius:var(--r-sm);
    width:100%; resize:vertical; min-height:44px;
    transition:border-color .12s;
  }
  textarea.note-in:focus{ outline:none; border-color:var(--iron); }

  .manage-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:13px 14px; background:var(--surface);
    border:1px solid var(--line-soft); border-radius:var(--r-sm); margin-bottom:7px;
  }
  .manage-row .nm{ font-size:14.5px; }
  .manage-row .meta{
    font-family:'JetBrains Mono', monospace;
    font-size:10px; color:var(--dim); margin-top:2px;
  }
  .row-actions{ display:flex; gap:6px; flex-shrink:0; }
  .mini-btn{
    background:transparent; border:1px solid var(--line);
    color:var(--muted); border-radius:6px; padding:6px 10px;
    font-family:'JetBrains Mono', monospace; font-size:10.5px; cursor:pointer;
  }
  .mini-btn:active{ background:var(--surface-2); }
  .del-btn{
    background:transparent; border:1px solid var(--danger-bd);
    color:var(--danger-fg); border-radius:6px; padding:6px 11px;
    font-family:'JetBrains Mono', monospace; font-size:10.5px;
    cursor:pointer; flex-shrink:0;
  }
  .del-btn:active{ background:var(--danger-bg); }

  /* SETTINGS TOGGLES */
  .seg{
    display:grid; grid-auto-flow:column; gap:0;
    background:var(--bg); border:1px solid var(--line);
    border-radius:var(--r-sm); overflow:hidden;
  }
  .seg button{
    background:transparent; border:none; color:var(--muted);
    padding:11px 6px; cursor:pointer;
    font-family:'JetBrains Mono', monospace; font-size:11.5px;
    transition:background .12s, color .12s;
  }
  .seg button.on{ background:var(--iron); color:#FFF; }
  .set-row{ margin-bottom:18px; }
  .set-row:last-child{ margin-bottom:0; }
  .set-row .k{
    font-family:'JetBrains Mono', monospace;
    font-size:10px; color:var(--dim);
    letter-spacing:0.4px; margin-bottom:8px;
  }

  /* ANALYSE */
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .stat{
    background:var(--surface); border:1px solid var(--line-soft);
    border-radius:var(--r-sm); padding:14px;
  }
  .stat .k{
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px; color:var(--dim); letter-spacing:0.4px;
  }
  .stat .v{
    font-family:'Bebas Neue', sans-serif;
    font-size:27px; letter-spacing:0.5px; margin-top:5px; line-height:1;
  }
  .stat .u{ font-size:14px; color:var(--muted); margin-left:3px; }
  .bar-row{ margin-bottom:11px; }
  .bar-head{
    display:flex; justify-content:space-between; align-items:baseline;
    gap:10px; margin-bottom:5px;
  }
  .bar-head .n{ font-size:13.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-head .v{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; color:var(--muted); flex-shrink:0;
  }
  .bar-track{ height:7px; background:var(--surface-2); border-radius:100px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:100px; background:var(--accent, var(--iron)); }
  .rank-row{
    display:flex; align-items:center; gap:11px;
    padding:11px 2px; border-bottom:1px solid var(--line-soft);
  }
  .rank-row:last-child{ border-bottom:none; }
  .rank-n{
    font-family:'Bebas Neue', sans-serif; font-size:17px;
    color:var(--dim); width:20px; flex-shrink:0;
  }
  .rank-row .nm{ flex:1; font-size:14px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rank-row .sub{ font-family:'JetBrains Mono', monospace; font-size:9.5px; color:var(--dim); margin-top:2px; }
  .rank-row .v{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted); flex-shrink:0; }
  .chart-wrap{ margin-top:4px; }
  .chart-wrap svg{ width:100%; height:auto; display:block; overflow:visible; }
  .pick-row{ display:flex; gap:8px; margin-bottom:14px; overflow-x:auto; padding-bottom:2px; }
  .pick{
    background:var(--surface); border:1px solid var(--line-soft);
    color:var(--muted); border-radius:100px;
    padding:8px 14px; cursor:pointer; white-space:nowrap;
    font-family:'JetBrains Mono', monospace; font-size:11px;
  }
  .pick.on{ background:var(--iron); border-color:var(--iron); color:#FFF; }

  .toast{
    position:fixed; bottom:calc(90px + env(safe-area-inset-bottom));
    left:50%; transform:translateX(-50%) translateY(16px);
    background:var(--tape); color:var(--toast-fg);
    padding:11px 20px; border-radius:100px;
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px; font-weight:500;
    opacity:0; transition:opacity .2s, transform .2s;
    pointer-events:none; z-index:60;
    box-shadow:0 8px 24px rgba(0,0,0,.3);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.warn{ background:var(--danger-fg); color:#FFF; }

  .banner{
    display:none; background:#2E1F14; border:1px solid #4A3520;
    border-radius:var(--r-sm); color:#E8C89A;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px; padding:11px 14px;
    line-height:1.6; margin:0 20px 12px;
  }
  .banner.show{ display:block; }

  /* TIMER */
  .timer-stage{
    display:flex; flex-direction:column; align-items:center;
    padding:18px 0 6px;
  }
  .ring-wrap{ position:relative; width:236px; max-width:74vw; }
  .ring-wrap svg{ width:100%; height:auto; display:block; transform:rotate(-90deg); }
  .ring-bg{ fill:none; stroke:var(--surface-2); stroke-width:9; }
  .ring-fg{
    fill:none; stroke:var(--iron); stroke-width:9; stroke-linecap:round;
    transition:stroke-dashoffset .25s linear, stroke .2s;
  }
  .ring-face{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:3px;
  }
  .ring-time{
    font-family:'Bebas Neue', sans-serif;
    font-size:52px; letter-spacing:1.5px; line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .ring-state{
    font-family:'JetBrains Mono', monospace;
    font-size:10px; letter-spacing:1px; color:var(--dim);
  }
  .timer-ctrl{
    display:grid; grid-template-columns:1fr 1fr; gap:9px;
    width:100%; margin:20px 0 4px;
  }
  .preset-grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:8px;
  }
  .preset{
    background:var(--surface); border:1px solid var(--line-soft);
    color:var(--chalk); border-radius:var(--r-sm);
    padding:14px 4px; cursor:pointer;
    font-family:'JetBrains Mono', monospace; font-size:12.5px;
    font-variant-numeric:tabular-nums;
    transition:transform .1s, border-color .12s, background .12s;
  }
  .preset:active{ transform:scale(.95); }
  .preset.on{ background:var(--iron); border-color:var(--iron); color:#FFF; }
  html[data-theme="light"] .preset{ box-shadow:var(--shadow); }
  .timer-note{
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px; color:var(--dim);
    text-align:center; line-height:1.7; margin-top:16px;
  }
  .ring-fg.done{ stroke:var(--tape); }
</style>
</head>
<body>
<div class="app">
  <div class="banner" id="storageBanner">Storage is blocked in this browser (private mode?) — progress won't be saved after closing.</div>

  <div class="topbar">
    <div class="topbar-left">
      <button class="icon-btn hidden" id="backBtn">‹</button>
      <div class="titles">
        <h1 id="pageTitle">RACK</h1>
        <div class="sub" id="pageSub">log it. lift it.</div>
      </div>
    </div>
    <button class="icon-btn hidden" id="manageBtn">⋯</button>
  </div>

  <main>
    <div class="view active" id="view-home"><div class="split-grid" id="splitGrid"></div></div>

    <div class="view" id="view-newsection">
      <div class="card">
        <div class="label">NEW SECTION</div>
        <div class="field" style="margin-bottom:14px;">
          <label>SECTION NAME</label>
          <input type="text" id="newCatName" placeholder="e.g. Sprints" autocomplete="off">
        </div>
        <div class="field" style="margin-bottom:6px;">
          <label>DEFAULT METRIC FOR NEW EXERCISES</label>
          <select id="newCatType"></select>
        </div>
        <div class="hint">Just the starting point — every exercise can use its own metric.</div>
        <div class="field" style="margin-bottom:16px;">
          <label>COLOUR</label>
          <select id="newCatColor">
            <option value="--iron">Orange</option>
            <option value="--tape">Lime</option>
            <option value="--sky">Blue</option>
            <option value="--violet">Violet</option>
            <option value="--green">Green</option>
          </select>
        </div>
        <button class="btn btn-primary" id="addCatBtn">CREATE SECTION</button>
      </div>
    </div>

    <div class="view" id="view-category">
      <div id="exList"></div>
      <div style="margin-top:14px;">
        <button class="btn btn-ghost" id="showAddExBtn">+ ADD EXERCISE</button>
      </div>
    </div>

    <div class="view" id="view-addex">
      <div class="card">
        <div class="label">NEW EXERCISE</div>
        <div class="field" style="margin-bottom:14px;">
          <label>EXERCISE NAME</label>
          <input type="text" id="newExName" placeholder="e.g. Pull Up" autocomplete="off">
        </div>
        <div class="field" style="margin-bottom:16px;">
          <label>HOW DO YOU MEASURE IT?</label>
          <select id="newExType"></select>
        </div>
        <button class="btn btn-primary" id="addExBtn">ADD EXERCISE</button>
      </div>
    </div>

    <div class="view" id="view-exercise">
      <div class="card">
        <div class="label" id="logLabel">TODAY'S SESSION</div>
        <div id="fieldsHost"></div>
        <div class="field" style="margin-bottom:14px;">
          <label>NOTES (OPTIONAL)</label>
          <textarea class="note-in" id="inNote" placeholder="felt heavy, left shoulder twinge…"></textarea>
        </div>
        <button class="btn btn-primary" id="logBtn">LOG SESSION</button>
      </div>
      <div id="exStats"></div>
      <div class="sec-title">HISTORY</div>
      <div id="histList"></div>
    </div>

    <div class="view" id="view-edit">
      <div class="card">
        <div class="label" id="editLabel">EDIT ENTRY</div>
        <div id="editFieldsHost"></div>
        <div class="field" style="margin-bottom:14px;">
          <label>NOTES</label>
          <textarea class="note-in" id="editNote" placeholder="felt heavy, left shoulder twinge…"></textarea>
        </div>
        <button class="btn btn-primary" id="saveEditBtn" style="margin-bottom:10px;">SAVE CHANGES</button>
        <button class="btn btn-danger" id="delEntryBtn">DELETE THIS ENTRY</button>
      </div>
    </div>

    <div class="view" id="view-manage"><div id="manageHost"></div></div>

    <div class="view" id="view-timer">
      <div class="timer-stage">
        <div class="ring-wrap">
          <svg viewBox="0 0 200 200">
            <circle class="ring-bg" cx="100" cy="100" r="88"></circle>
            <circle class="ring-fg" id="ringFg" cx="100" cy="100" r="88"
              stroke-dasharray="552.92" stroke-dashoffset="0"></circle>
          </svg>
          <div class="ring-face">
            <div class="ring-time" id="ringTime">0:00</div>
            <div class="ring-state" id="ringState">PICK A TIME</div>
          </div>
        </div>
        <div class="timer-ctrl">
          <button class="btn btn-primary" id="tStart">START</button>
          <button class="btn btn-ghost" id="tReset">RESET</button>
        </div>
      </div>
      <div class="sec-title">PRESETS</div>
      <div class="preset-grid" id="presetGrid"></div>
      <div class="timer-note" id="wakeNote"></div>
    </div>

    <div class="view" id="view-analyse"><div id="analyseHost"></div></div>

    <div class="view" id="view-settings"><div id="settingsHost"></div></div>
  </main>
</div>

<div class="tabbar">
  <div class="tabbar-inner">
    <button class="tab on" data-tab="record"><span class="ico">◉</span><span class="lb">RECORD</span></button>
    <button class="tab" data-tab="timer"><span class="ico">◔</span><span class="lb">TIMER</span></button>
    <button class="tab" data-tab="analyse"><span class="ico">◧</span><span class="lb">ANALYSE</span></button>
    <button class="tab" data-tab="settings"><span class="ico">⚙</span><span class="lb">SETTINGS</span></button>
  </div>
</div>

<div class="toast" id="toast">Saved</div>

<script>
/* ---------- UNITS ---------- */
const KG_PER_LB = 0.45359237;
function toKg(v, unit){ return unit === 'lb' ? v * KG_PER_LB : v; }
function fromKg(kg, unit){ return unit === 'lb' ? kg / KG_PER_LB : kg; }
function round1(n){ return Math.round(n*10)/10; }
function unitLabel(){ return PREFS.unit === 'lb' ? 'lbs' : 'kg'; }

/* Weight as stored -> displayed in current preference */
function dispWeight(entry){
  const raw = parseFloat(entry.weight);
  if(isNaN(raw)) return entry.weight;
  const kg = toKg(raw, entry.unit || 'kg');
  return round1(fromKg(kg, PREFS.unit));
}
function kgOf(entry){
  const raw = parseFloat(entry.weight);
  if(isNaN(raw)) return 0;
  return toKg(raw, entry.unit || 'kg');
}

/* ---------- METRIC TYPES ---------- */
const TYPES = {
  weights: {
    label:'Weights', short:'weights',
    fields:[
      {key:'reps',   label:'REPS',   step:'1'},
      {key:'sets',   label:'SETS',   step:'1'},
      {key:'weight', label:'WEIGHT', step:'0.5', unit:true}
    ],
    fmt: e => `${e.reps}×${e.sets} · ${dispWeight(e)}${unitLabel()}`,
    volume: e => (parseFloat(e.reps)||0) * (parseFloat(e.sets)||0) * kgOf(e),
    volKey: 'weighted'
  },
  bodyweight: {
    label:'Bodyweight', short:'bodyweight',
    fields:[
      {key:'reps', label:'REPS', step:'1'},
      {key:'sets', label:'SETS', step:'1'}
    ],
    fmt: e => `${e.reps}×${e.sets} BW`,
    volume: e => (parseFloat(e.reps)||0) * (parseFloat(e.sets)||0),
    volKey: 'bodyweight'
  },
  running: {
    label:'Running', short:'running',
    fields:[
      {key:'distance', label:'DISTANCE (M)', step:'1'},
      {key:'seconds',  label:'TIME (SEC)',   step:'0.01'},
      {key:'reps',     label:'REPS',         step:'1'}
    ],
    fmt: e => `${e.distance}m · ${e.seconds}s${e.reps && e.reps!=='1' ? ' ×'+e.reps : ''}`,
    volume: e => (parseFloat(e.distance)||0) * (parseFloat(e.reps)||1),
    volKey: 'distance'
  },
  stretching: {
    label:'Stretching', short:'stretching',
    fields:[
      {key:'seconds', label:'HOLD (SEC)', step:'1'},
      {key:'sets',    label:'SETS',       step:'1'}
    ],
    fmt: e => `${e.seconds}s × ${e.sets}`,
    volume: e => (parseFloat(e.seconds)||0) * (parseFloat(e.sets)||0),
    volKey: 'holdtime'
  }
};
const TYPE_KEYS = Object.keys(TYPES);
const VOL_META = {
  weighted:   { label:'Weighted volume', unit: () => unitLabel(), conv: kg => round1(fromKg(kg, PREFS.unit)) },
  bodyweight: { label:'Bodyweight reps',  unit: () => 'reps',      conv: v => Math.round(v) },
  distance:   { label:'Distance',         unit: () => 'm',         conv: v => Math.round(v) },
  holdtime:   { label:'Hold time',        unit: () => 'sec',       conv: v => Math.round(v) }
};

/* ---------- DEFAULTS ---------- */
function ex(n,t){ return {name:n, type:t}; }
const DEFAULTS = {
  push: { label:'Push', type:'weights', color:'--iron', exercises:[
    ex("Flat Bench Press","weights"), ex("Incline Bench Press","weights"),
    ex("Skull Crusher","weights"), ex("Overhead Press","weights"),
    ex("Tricep Push Down","weights"), ex("Chest Fly","weights")]},
  pull: { label:'Pull', type:'weights', color:'--tape', exercises:[
    ex("Lat Pulldown","weights"), ex("Seated Row","weights"),
    ex("Pull Up","bodyweight"), ex("Hammer Curl","weights"),
    ex("Back Extension","bodyweight"), ex("Single-Arm Rear Delt Fly","weights"),
    ex("Shrug","weights")]},
  legs: { label:'Legs', type:'weights', color:'--sky', exercises:[
    ex("Back Squat","weights"), ex("Leg Extension Machine","weights"),
    ex("Hamstring Curl Machine","weights"), ex("Adductor Machine","weights"),
    ex("Abductor Machine","weights"), ex("Seated Calf Raise","weights"),
    ex("Standing Calf Raise","weights"), ex("Split Squat","weights"),
    ex("Nordic Curl","bodyweight"), ex("Power Clean","weights"),
    ex("Hip Flexor Raise","bodyweight")]},
  core: { label:'Core', type:'bodyweight', color:'--violet', exercises:[
    ex("Copenhagen Plank","stretching"), ex("Crunches","bodyweight"),
    ex("Decline Crunches","bodyweight")]}
};

let CATEGORIES = {};
let PREFS = { theme:'dark', unit:'kg' };
let state = { tab:'record', screen:'home', category:null, exercise:null };
let analyseScope = 'all';

/* ---------- STORAGE ---------- */
const hasLS = (()=>{ try{ localStorage.setItem('__t__','1'); localStorage.removeItem('__t__'); return true; }catch(e){ return false; } })();
const mem = {};
const store = hasLS
  ? { get:k=>localStorage.getItem(k), set:(k,v)=>localStorage.setItem(k,v), del:k=>localStorage.removeItem(k) }
  : { get:k=>(k in mem?mem[k]:null), set:(k,v)=>{mem[k]=v;}, del:k=>{delete mem[k];} };
if(!hasLS){
  document.addEventListener('DOMContentLoaded', ()=> document.getElementById('storageBanner').classList.add('show'));
}

function loadPrefs(){
  const raw = store.get('rack:prefs');
  if(raw){ try{ PREFS = Object.assign(PREFS, JSON.parse(raw)); }catch(e){} }
  applyTheme();
}
function savePrefs(){ store.set('rack:prefs', JSON.stringify(PREFS)); }
function applyTheme(){
  document.documentElement.setAttribute('data-theme', PREFS.theme);
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', PREFS.theme === 'light' ? '#F6F5F1' : '#0E1013');
}

function migrate(cats){
  let changed = false;
  Object.keys(cats).forEach(k=>{
    const c = cats[k];
    if(!Array.isArray(c.exercises)){ c.exercises = []; changed = true; return; }
    c.exercises = c.exercises.map(e=>{
      if(typeof e === 'string'){ changed = true; return {name:e, type:c.type||'weights'}; }
      if(!e.type){ changed = true; return {name:e.name, type:c.type||'weights'}; }
      return e;
    });
  });
  return changed;
}
function loadCategories(){
  const raw = store.get('rack:cats');
  if(raw){
    try{ CATEGORIES = JSON.parse(raw); if(migrate(CATEGORIES)) saveCategories(); return; }catch(e){}
  }
  CATEGORIES = JSON.parse(JSON.stringify(DEFAULTS));
  saveCategories();
}
function saveCategories(){ store.set('rack:cats', JSON.stringify(CATEGORIES)); }

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
function key(c,n){ return 'log:'+c+':'+slug(n); }
function getHistory(c,n){
  const raw = store.get(key(c,n));
  if(!raw) return [];
  try{ return JSON.parse(raw); }catch(e){ return []; }
}
function saveHistory(c,n,e){ try{ store.set(key(c,n), JSON.stringify(e)); return true; }catch(err){ return false; } }
function deleteHistory(c,n){ try{ store.del(key(c,n)); }catch(e){} }

function findEx(c,n){ const cat = CATEGORIES[c]; return cat ? (cat.exercises.find(e=>e.name===n)||null) : null; }
function typeOf(c,n){
  const e = findEx(c,n);
  return TYPES[(e&&e.type) || (CATEGORIES[c]&&CATEGORIES[c].type) || 'weights'] || TYPES.weights;
}

/* ---------- HELPERS ---------- */
function fmtDate(iso){
  const d = new Date(iso), now = new Date();
  if(d.toDateString()===now.toDateString()) return 'Today';
  const y = new Date(now); y.setDate(y.getDate()-1);
  if(d.toDateString()===y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString(undefined,{month:'short', day:'numeric'});
}
function shortDate(iso){
  return new Date(iso).toLocaleDateString(undefined,{month:'numeric', day:'numeric'});
}
function toast(msg, warn){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (warn?' warn':'');
  clearTimeout(t._x);
  t._x = setTimeout(()=> t.className='toast', 1600);
}
function summarise(c,n){
  const h = getHistory(c,n);
  if(!h.length) return '<span class="none">—</span>';
  try{ return typeOf(c,n).fmt(h[0]); }catch(e){ return '<span class="none">—</span>'; }
}
function typeOptions(sel){
  return TYPE_KEYS.map(k=>{
    const f = TYPES[k].fields.map(x=>x.label.toLowerCase().replace(/ \(.*\)/,'')).join(', ');
    return `<option value="${k}"${k===sel?' selected':''}>${TYPES[k].label} — ${f}</option>`;
  }).join('');
}
function fieldLabel(f){ return f.unit ? f.label + ' (' + unitLabel().toUpperCase() + ')' : f.label; }
function nf(n){ return n >= 10000 ? Math.round(n).toLocaleString() : (Math.round(n*10)/10).toLocaleString(); }

/* ---------- NAV ---------- */
function setView(name, opts){
  opts = opts || {};
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.getElementById('backBtn').classList.toggle('hidden', !opts.back);
  document.getElementById('manageBtn').classList.toggle('hidden', !opts.manage);
  window.scrollTo(0,0);
}
function setTitle(t,s){
  document.getElementById('pageTitle').textContent = t;
  document.getElementById('pageSub').textContent = s;
}
function setTab(tab){
  state.tab = tab;
  document.querySelectorAll('.tab').forEach(b=> b.classList.toggle('on', b.dataset.tab===tab));
}

function goHome(){
  setTab('record');
  state.screen='home'; state.category=null; state.exercise=null;
  setTitle('RACK','log it. lift it.');
  setView('home', {manage:true});
  renderHome();
}
function goNewSection(){
  state.screen='newsection';
  setTitle('NEW SECTION','name it and pick a default');
  setView('newsection', {back:true});
  document.getElementById('newCatName').value='';
  document.getElementById('newCatType').innerHTML = typeOptions('weights');
}
function goCategory(k){
  const cat = CATEGORIES[k];
  if(!cat) return goHome();
  setTab('record');
  state.screen='category'; state.category=k;
  setTitle(cat.label.toUpperCase(), cat.exercises.length+' exercises');
  setView('category', {back:true, manage:true});
  renderCategory(k);
}
function goAddEx(){
  state.screen='addex';
  const cat = CATEGORIES[state.category];
  setTitle('ADD EXERCISE', cat.label);
  setView('addex', {back:true});
  document.getElementById('newExName').value='';
  document.getElementById('newExType').innerHTML = typeOptions(cat.type||'weights');
}
function goExercise(c,n){
  state.screen='exercise'; state.category=c; state.exercise=n;
  setTitle(n.toUpperCase(), CATEGORIES[c].label + ' · ' + typeOf(c,n).short);
  setView('exercise', {back:true});
  renderExercise();
}
function goManage(){
  state.screen='manage';
  setView('manage', {back:true});
  renderManage();
}
function goTimer(){
  setTab('timer');
  state.screen='timer';
  setTitle('TIMER','tap a time, it starts');
  setView('timer');
  renderTimer();
}
function goAnalyse(){
  setTab('analyse');
  state.screen='analyse';
  setTitle('ANALYSE','what the numbers say');
  setView('analyse');
  renderAnalyse();
}
function goSettings(){
  setTab('settings');
  state.screen='settings';
  setTitle('SETTINGS','make it yours');
  setView('settings');
  renderSettings();
}

/* ---------- RENDER: RECORD ---------- */
function renderHome(){
  const g = document.getElementById('splitGrid');
  g.innerHTML='';
  Object.keys(CATEGORIES).forEach(k=>{
    const c = CATEGORIES[k];
    const t = document.createElement('div');
    t.className='split-tile';
    t.style.setProperty('--accent','var('+(c.color||'--iron')+')');
    t.innerHTML = `<div class="dot"></div><div><div class="name">${c.label}</div>
      <div class="count">${c.exercises.length} exercises</div></div>`;
    t.onclick = ()=> goCategory(k);
    g.appendChild(t);
  });
  const a = document.createElement('div');
  a.className='add-tile';
  a.innerHTML = `<div class="plus">+</div><div class="lbl">NEW SECTION</div>`;
  a.onclick = goNewSection;
  g.appendChild(a);
}

function renderCategory(k){
  const l = document.getElementById('exList');
  l.innerHTML='';
  const cat = CATEGORIES[k];
  if(!cat.exercises.length){
    l.innerHTML = '<div class="empty-note">No exercises here yet.<br>Add your first one below.</div>';
    return;
  }
  cat.exercises.forEach(e=>{
    const r = document.createElement('div');
    r.className='ex-row';
    const t = TYPES[e.type]||TYPES.weights;
    r.innerHTML = `<div><div class="name">${e.name}</div><div class="tag">${t.short}</div></div>
      <div class="right"><div class="last">${summarise(k,e.name)}</div><div class="chev">›</div></div>`;
    r.onclick = ()=> goExercise(k, e.name);
    l.appendChild(r);
  });
}

function renderExercise(){
  const c = state.category, n = state.exercise;
  const type = typeOf(c,n);
  const hist = getHistory(c,n);
  const last = hist[0];

  document.getElementById('logLabel').textContent =
    last ? 'PREFILLED FROM LAST — EDIT AND LOG' : "TODAY'S SESSION";

  const host = document.getElementById('fieldsHost');
  host.innerHTML='';
  const row = document.createElement('div');
  row.className = 'field-row c' + Math.min(type.fields.length,3);
  type.fields.forEach(f=>{
    let val = '';
    if(last && last[f.key] !== undefined){
      val = f.unit ? dispWeight(last) : last[f.key];
    }
    const w = document.createElement('div');
    w.className='field';
    w.innerHTML = `<label>${fieldLabel(f)}</label>
      <input type="number" inputmode="decimal" step="${f.step}" data-k="${f.key}"
       ${f.unit?'data-unit="1"':''} value="${val}" placeholder="0">`;
    row.appendChild(w);
  });
  host.appendChild(row);

  /* today's note prefills only if today's entry already exists */
  const todayStr = new Date().toDateString();
  const todayEntry = last && new Date(last.date).toDateString()===todayStr ? last : null;
  document.getElementById('inNote').value = todayEntry && todayEntry.note ? todayEntry.note : '';

  /* mini stats */
  const st = document.getElementById('exStats');
  st.innerHTML = '';
  if(hist.length >= 2){
    const meta = VOL_META[type.volKey];
    const vols = hist.map(e=>type.volume(e));
    const best = Math.max.apply(null, vols);
    st.innerHTML = `<div class="stat-grid">
      <div class="stat"><div class="k">SESSIONS</div><div class="v">${hist.length}</div></div>
      <div class="stat"><div class="k">BEST SESSION</div><div class="v">${nf(meta.conv(best))}<span class="u">${meta.unit()}</span></div></div>
    </div>`;
    st.appendChild(lineChart(hist.slice(0,14).reverse().map(e=>({
      x: shortDate(e.date), y: meta.conv(type.volume(e))
    })), meta.label));
  }

  const hl = document.getElementById('histList');
  hl.innerHTML='';
  if(!hist.length){
    hl.innerHTML = '<div class="empty-note">No sessions logged yet.</div>';
  } else {
    hist.slice(0,60).forEach((e, idx)=>{
      const r = document.createElement('div');
      r.className='hist-row';
      let s; try{ s = type.fmt(e); }catch(err){ s='—'; }
      const note = e.note ? `<div class="hist-note">${escapeHtml(e.note)}</div>` : '';
      const left = document.createElement('div');
      left.className = 'hist-left';
      left.innerHTML = `<div class="date">${fmtDate(e.date)}</div>
        <div class="stats">${s}</div>${note}`;
      const right = document.createElement('div');
      right.className = 'hist-right';
      const eb = document.createElement('button');
      eb.className = 'edit-dot'; eb.textContent = 'EDIT';
      eb.onclick = (ev)=>{ ev.stopPropagation(); goEdit(idx); };
      right.appendChild(eb);
      r.appendChild(left); r.appendChild(right);
      hl.appendChild(r);
    });
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

function goEdit(idx){
  state.screen = 'edit'; state.editIdx = idx;
  const c = state.category, n = state.exercise;
  const type = typeOf(c,n);
  const hist = getHistory(c,n);
  const entry = hist[idx];
  if(!entry) return goExercise(c,n);

  setTitle('EDIT ENTRY', n + ' · ' + fmtDate(entry.date));
  setView('edit', {back:true});
  document.getElementById('editLabel').textContent =
    'LOGGED ' + new Date(entry.date).toLocaleDateString(undefined,
      {weekday:'short', day:'numeric', month:'short', year:'numeric'}).toUpperCase();

  const host = document.getElementById('editFieldsHost');
  host.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'field-row c' + Math.min(type.fields.length,3);
  type.fields.forEach(f=>{
    let val = entry[f.key] !== undefined ? (f.unit ? dispWeight(entry) : entry[f.key]) : '';
    const w = document.createElement('div');
    w.className='field';
    w.innerHTML = `<label>${fieldLabel(f)}</label>
      <input type="number" inputmode="decimal" step="${f.step}" data-k="${f.key}"
       ${f.unit?'data-unit="1"':''} value="${val}" placeholder="0">`;
    row.appendChild(w);
  });
  host.appendChild(row);
  document.getElementById('editNote').value = entry.note || '';
}

function renderManage(){
  const host = document.getElementById('manageHost');
  host.innerHTML='';
  if(state.category && CATEGORIES[state.category]){
    const ck = state.category, cat = CATEGORIES[ck];
    setTitle('MANAGE', cat.label.toLowerCase());
    const c = document.createElement('div');
    c.className='card';
    c.innerHTML = '<div class="label">EXERCISES — CHANGE METRIC OR DELETE</div>';
    if(!cat.exercises.length) c.innerHTML += '<div class="empty-note" style="padding:8px 0;">Nothing here yet.</div>';
    host.appendChild(c);

    cat.exercises.forEach(e=>{
      const r = document.createElement('div');
      r.className='manage-row';
      const n = getHistory(ck,e.name).length;
      const left = document.createElement('div');
      left.style.minWidth='0';
      left.innerHTML = `<div class="nm">${e.name}</div>
        <div class="meta">${(TYPES[e.type]||TYPES.weights).short} · ${n} session${n===1?'':'s'}</div>`;
      r.appendChild(left);
      const acts = document.createElement('div');
      acts.className='row-actions';
      const mb = document.createElement('button');
      mb.className='mini-btn'; mb.textContent='METRIC';
      mb.onclick = ()=>{
        const i = TYPE_KEYS.indexOf(e.type);
        e.type = TYPE_KEYS[(i+1)%TYPE_KEYS.length];
        saveCategories(); renderManage();
        toast('Now ' + (TYPES[e.type]||TYPES.weights).short);
      };
      acts.appendChild(mb);
      const b = document.createElement('button');
      b.className='del-btn'; b.textContent='DELETE';
      b.onclick = ()=>{
        if(!confirm('Delete "'+e.name+'"? Its logged history goes too.')) return;
        cat.exercises = cat.exercises.filter(x=>x.name!==e.name);
        deleteHistory(ck,e.name); saveCategories(); renderManage();
        toast('Exercise deleted');
      };
      acts.appendChild(b);
      r.appendChild(acts);
      host.appendChild(r);
    });

    const d = document.createElement('div');
    d.style.marginTop='20px';
    const db = document.createElement('button');
    db.className='btn btn-danger'; db.textContent='DELETE WHOLE SECTION';
    db.onclick = ()=>{
      if(!confirm('Delete the entire "'+cat.label+'" section and all its history?')) return;
      cat.exercises.forEach(x=>deleteHistory(ck,x.name));
      delete CATEGORIES[ck]; saveCategories();
      toast('Section deleted'); goHome();
    };
    d.appendChild(db); host.appendChild(d);

  } else {
    setTitle('MANAGE','sections');
    const c = document.createElement('div');
    c.className='card';
    c.innerHTML = '<div class="label">SECTIONS — TAP DELETE TO REMOVE</div>';
    host.appendChild(c);
    Object.keys(CATEGORIES).forEach(k=>{
      const cat = CATEGORIES[k];
      const r = document.createElement('div');
      r.className='manage-row';
      r.innerHTML = `<div><div class="nm">${cat.label}</div>
        <div class="meta">${cat.exercises.length} exercises</div></div>`;
      const b = document.createElement('button');
      b.className='del-btn'; b.textContent='DELETE';
      b.onclick = ()=>{
        if(!confirm('Delete the entire "'+cat.label+'" section and all its history?')) return;
        cat.exercises.forEach(x=>deleteHistory(k,x.name));
        delete CATEGORIES[k]; saveCategories(); renderManage();
        toast('Section deleted');
      };
      r.appendChild(b); host.appendChild(r);
    });
    const rs = document.createElement('div');
    rs.style.marginTop='20px';
    const rb = document.createElement('button');
    rb.className='btn btn-ghost'; rb.textContent='RESTORE DEFAULT SECTIONS';
    rb.onclick = ()=>{
      if(!confirm('Add back any missing default sections?')) return;
      Object.keys(DEFAULTS).forEach(k=>{
        if(!CATEGORIES[k]) CATEGORIES[k] = JSON.parse(JSON.stringify(DEFAULTS[k]));
      });
      saveCategories(); renderManage(); toast('Defaults restored');
    };
    rs.appendChild(rb); host.appendChild(rs);
  }
}

/* ---------- CHARTS ---------- */
function lineChart(points, label){
  const wrap = document.createElement('div');
  wrap.className = 'card';
  if(points.length < 2){ wrap.innerHTML = '<div class="empty-note" style="padding:10px 0;">Not enough data yet.</div>'; return wrap; }
  const W = 320, H = 120, PX = 6, PY = 12;
  const ys = points.map(p=>p.y);
  const max = Math.max.apply(null, ys), min = Math.min.apply(null, ys);
  const span = (max - min) || 1;
  const step = (W - PX*2) / (points.length - 1);
  const xy = points.map((p,i)=>{
    const x = PX + i*step;
    const y = PY + (H - PY*2) * (1 - (p.y - min)/span);
    return [x,y];
  });
  const path = xy.map((p,i)=> (i?'L':'M') + round1(p[0]) + ' ' + round1(p[1])).join(' ');
  const area = path + ` L${round1(xy[xy.length-1][0])} ${H-PY} L${round1(xy[0][0])} ${H-PY} Z`;
  const dots = xy.map(p=>`<circle cx="${round1(p[0])}" cy="${round1(p[1])}" r="2.6" fill="var(--iron)"/>`).join('');
  wrap.innerHTML = `<div class="label">${label.toUpperCase()} — LAST ${points.length} SESSIONS</div>
    <div class="chart-wrap"><svg viewBox="0 0 ${W} ${H+18}" preserveAspectRatio="none">
      <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--iron)" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="var(--iron)" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${area}" fill="url(#g1)"/>
      <path d="${path}" fill="none" stroke="var(--iron)" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
      <text x="${PX}" y="${H+13}" font-family="JetBrains Mono" font-size="9"
        fill="var(--dim)">${points[0].x}</text>
      <text x="${W-PX}" y="${H+13}" text-anchor="end" font-family="JetBrains Mono"
        font-size="9" fill="var(--dim)">${points[points.length-1].x}</text>
    </svg></div>
    <div style="display:flex; justify-content:space-between; margin-top:8px;
      font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--dim);">
      <span>low ${nf(min)}</span><span>high ${nf(max)}</span></div>`;
  return wrap;
}

function barList(rows, accent){
  const host = document.createElement('div');
  if(!rows.length){ host.innerHTML = '<div class="empty-note" style="padding:10px 0;">No data yet.</div>'; return host; }
  const max = Math.max.apply(null, rows.map(r=>r.value)) || 1;
  rows.forEach(r=>{
    const d = document.createElement('div');
    d.className='bar-row';
    if(r.color) d.style.setProperty('--accent','var('+r.color+')');
    else if(accent) d.style.setProperty('--accent','var('+accent+')');
    d.innerHTML = `<div class="bar-head"><div class="n">${r.name}</div>
      <div class="v">${nf(r.value)} ${r.unit||''}</div></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,(r.value/max)*100)}%"></div></div>`;
    host.appendChild(d);
  });
  return host;
}

/* ---------- RENDER: ANALYSE ---------- */
function collectStats(){
  const out = { sessions:0, exercises:0, byCat:{}, byEx:[],
                totalSets:0, totalWeight:0, totalHold:0 };
  Object.keys(CATEGORIES).forEach(ck=>{
    const cat = CATEGORIES[ck];
    out.byCat[ck] = { label:cat.label, color:cat.color, sessions:0, sets:0, weight:0 };
    cat.exercises.forEach(e=>{
      const type = TYPES[e.type]||TYPES.weights;
      const hist = getHistory(ck, e.name);
      if(!hist.length) return;
      out.exercises++;
      let sets = 0, weight = 0;
      hist.forEach(en=>{
        out.sessions++;
        out.byCat[ck].sessions++;
        const s = parseFloat(en.sets) || parseFloat(en.reps) || 0;
        sets += s;
        if(type.volKey === 'weighted'){
          weight += (parseFloat(en.reps)||0) * (parseFloat(en.sets)||0) * kgOf(en);
        }
        if(type.volKey === 'holdtime'){
          out.totalHold += (parseFloat(en.seconds)||0) * (parseFloat(en.sets)||0);
        }
      });
      out.totalSets += sets;
      out.totalWeight += weight;
      out.byCat[ck].sets += sets;
      out.byCat[ck].weight += weight;
      out.byEx.push({
        cat:ck, catLabel:cat.label, color:cat.color, name:e.name,
        weighted: type.volKey === 'weighted',
        sets:sets, weight:weight, sessions:hist.length
      });
    });
  });
  return out;
}

function renderAnalyse(){
  const host = document.getElementById('analyseHost');
  host.innerHTML='';
  const S = collectStats();

  if(!S.sessions){
    host.innerHTML = '<div class="empty-note">Nothing to analyse yet.<br>Log a few sessions and come back.</div>';
    return;
  }

  const head = document.createElement('div');
  head.className='stat-grid';
  head.innerHTML = `
    <div class="stat"><div class="k">SESSIONS LOGGED</div><div class="v">${S.sessions}</div></div>
    <div class="stat"><div class="k">SET VOLUME</div><div class="v">${nf(S.totalSets)}<span class="u">sets</span></div></div>
    <div class="stat"><div class="k">WEIGHT VOLUME</div><div class="v">${nf(round1(fromKg(S.totalWeight, PREFS.unit)))}<span class="u">${unitLabel()}</span></div></div>
    <div class="stat"><div class="k">SECONDS STRETCHED</div><div class="v">${nf(Math.round(S.totalHold))}<span class="u">sec</span></div></div>`;
  host.appendChild(head);

  if(analyseScope !== 'sets' && analyseScope !== 'weight') analyseScope = 'sets';
  const pick = document.createElement('div');
  pick.className='pick-row';
  [{k:'sets', l:'Set volume'}, {k:'weight', l:'Weight volume'}].forEach(o=>{
    const b = document.createElement('button');
    b.className = 'pick' + (analyseScope===o.k ? ' on' : '');
    b.textContent = o.l;
    b.onclick = ()=>{ analyseScope = o.k; renderAnalyse(); };
    pick.appendChild(b);
  });
  host.appendChild(pick);

  const isW = analyseScope === 'weight';
  const unit = isW ? unitLabel() : 'sets';
  const valOf = o => isW ? round1(fromKg(o.weight, PREFS.unit)) : o.sets;

  const secCard = document.createElement('div');
  secCard.className='card';
  secCard.innerHTML = `<div class="label">${isW?'WEIGHT':'SET'} VOLUME BY SECTION</div>`;
  const secRows = Object.keys(S.byCat)
    .map(ck=>{
      const c = S.byCat[ck];
      return { name:c.label, value:valOf(c), unit:unit, color:c.color };
    })
    .filter(r=>r.value > 0)
    .sort((a,b)=>b.value-a.value);
  if(secRows.length) secCard.appendChild(barList(secRows));
  else secCard.innerHTML += '<div class="empty-note" style="padding:10px 0;">No data for this metric.</div>';
  host.appendChild(secCard);

  const rankCard = document.createElement('div');
  rankCard.className='card';
  rankCard.innerHTML = `<div class="label">TOP EXERCISES BY ${isW?'WEIGHT':'SET'} VOLUME</div>`;
  const ranked = S.byEx
    .filter(r=> isW ? (r.weighted && r.weight > 0) : r.sets > 0)
    .sort((a,b)=> valOf(b) - valOf(a));
  if(!ranked.length){
    rankCard.innerHTML += '<div class="empty-note" style="padding:10px 0;">No data for this metric.</div>';
  } else {
    ranked.slice(0,10).forEach((r,i)=>{
      const row = document.createElement('div');
      row.className='rank-row';
      row.innerHTML = `<div class="rank-n">${i+1}</div>
        <div style="flex:1; min-width:0;"><div class="nm">${r.name}</div>
        <div class="sub">${r.catLabel} · ${nf(r.sets)} set${r.sets===1?'':'s'}</div></div>
        <div class="v">${nf(valOf(r))} ${unit}</div>`;
      row.onclick = ()=> goExercise(r.cat, r.name);
      row.style.cursor = 'pointer';
      rankCard.appendChild(row);
    });
  }
  host.appendChild(rankCard);

  const freqCard = document.createElement('div');
  freqCard.className='card';
  freqCard.innerHTML = '<div class="label">TOP 5 MOST TRAINED — BY SETS</div>';
  const freq = S.byEx.slice().sort((a,b)=>b.sets-a.sets).slice(0,5)
    .map(r=>({name:r.name, value:r.sets, unit:'sets', color:r.color}));
  freqCard.appendChild(barList(freq));
  host.appendChild(freqCard);
}

/* ---------- RENDER: SETTINGS ---------- */
function renderSettings(){
  const host = document.getElementById('settingsHost');
  host.innerHTML = '';

  const c = document.createElement('div');
  c.className = 'card';
  c.innerHTML = `
    <div class="set-row">
      <div class="k">APPEARANCE</div>
      <div class="seg" id="segTheme">
        <button data-v="dark">Dark</button><button data-v="light">Light</button>
      </div>
    </div>
    <div class="set-row">
      <div class="k">WEIGHT UNIT</div>
      <div class="seg" id="segUnit">
        <button data-v="kg">Kilograms</button><button data-v="lb">Pounds</button>
      </div>
      <div class="hint" style="margin-top:8px; margin-bottom:0;">Converts every logged weight, past and future.</div>
    </div>`;
  host.appendChild(c);

  const seg = (id, val, fn)=>{
    const el = document.getElementById(id);
    el.querySelectorAll('button').forEach(b=>{
      b.classList.toggle('on', b.dataset.v === val);
      b.onclick = ()=> fn(b.dataset.v);

  seg('segTheme', PREFS.theme, v=>{
    PREFS.theme = v; savePrefs(); applyTheme(); renderSettings();
    toast(v==='light' ? 'Light mode on' : 'Dark mode on');
  });
  seg('segUnit', PREFS.unit, v=>{
    PREFS.unit = v; savePrefs(); renderSettings();
    toast('Showing ' + (v==='lb' ? 'pounds' : 'kilograms'));
  });

  /* data card */
  const d = document.createElement('div');
  d.className='card';
  d.innerHTML = '<div class="label">DATA</div>';
  const mb = document.createElement('button');
  mb.className='btn btn-ghost'; mb.style.marginBottom='10px';
  mb.textContent='MANAGE SECTIONS & EXERCISES';
  mb.onclick = ()=>{ state.category = null; setTab('record'); goManage(); };
  d.appendChild(mb);

  const eb = document.createElement('button');
  eb.className='btn btn-ghost'; eb.style.marginBottom='10px';
  eb.textContent='EXPORT DATA (COPY)';
  eb.onclick = ()=>{
    const dump = { prefs:PREFS, cats:CATEGORIES, logs:{} };
    Object.keys(CATEGORIES).forEach(ck=>{
      CATEGORIES[ck].exercises.forEach(e=>{
        const h = getHistory(ck, e.name);
        if(h.length) dump.logs[ck+':'+slug(e.name)] = h;
      });
    });
    const txt = JSON.stringify(dump);
    if(navigator.clipboard){
      navigator.clipboard.writeText(txt).then(()=>toast('Copied to clipboard'),
        ()=>toast('Copy failed', true));
    } else { toast('Clipboard not available', true); }
  };
  d.appendChild(eb);

  const rb = document.createElement('button');
  rb.className='btn btn-danger';
  rb.textContent='RESET EVERYTHING';
  rb.onclick = ()=>{
    if(!confirm('Wipe all sections, exercises and logged history? This cannot be undone.')) return;
    if(!confirm('Really sure? Everything goes.')) return;
    Object.keys(CATEGORIES).forEach(ck=>
      CATEGORIES[ck].exercises.forEach(e=>deleteHistory(ck, e.name)));
    store.del('rack:cats');
    CATEGORIES = JSON.parse(JSON.stringify(DEFAULTS));
    saveCategories();
    toast('Everything reset');
    goHome();
  };
  d.appendChild(rb);
  host.appendChild(d);

  const about = document.createElement('div');
  about.className='card';
  about.innerHTML = `<div class="label">ABOUT</div>
    <div style="font-size:13px; color:var(--muted); line-height:1.7;">
    Rack stores everything on this device, in this browser. Nothing leaves your phone.
    Add it to your home screen for the app experience.</div>`;
  host.appendChild(about);
}

/* ---------- TIMER ---------- */
const PRESETS = [30, 45, 60, 90, 120, 150, 180, 300];
const RING_LEN = 2 * Math.PI * 88;
let T = { total:0, left:0, running:false, tick:null, endAt:0, wake:null };

function fmtClock(s){
  s = Math.max(0, Math.ceil(s));
  const m = Math.floor(s/60);
  return m + ':' + String(s % 60).padStart(2,'0');
}
function presetLabel(s){
  return s < 60 ? s + 's' : fmtClock(s);
}

function renderPresets(){
  const g = document.getElementById('presetGrid');
  g.innerHTML = '';
  PRESETS.forEach(s=>{
    const b = document.createElement('button');
    b.className = 'preset' + (T.total === s ? ' on' : '');
    b.textContent = presetLabel(s);
    b.onclick = ()=> pickPreset(s);
    g.appendChild(b);
  });
}

function paintTimer(){
  const ring = document.getElementById('ringFg');
  const frac = T.total ? T.left / T.total : 0;
  ring.style.strokeDasharray = RING_LEN;
  ring.style.strokeDashoffset = RING_LEN * (1 - frac);
  ring.classList.toggle('done', T.total > 0 && T.left <= 0);
  document.getElementById('ringTime').textContent = fmtClock(T.left);
  document.getElementById('ringState').textContent =
    !T.total ? 'PICK A TIME'
    : T.left <= 0 ? 'DONE'
    : T.running ? 'RUNNING' : 'PAUSED';
  document.getElementById('tStart').textContent =
    T.left <= 0 && T.total ? 'RESTART' : (T.running ? 'PAUSE' : 'START');
}

async function requestWake(){
  try{
    if('wakeLock' in navigator && !T.wake){
      T.wake = await navigator.wakeLock.request('screen');
      T.wake.addEventListener('release', ()=>{ T.wake = null; });
    }
  }catch(e){ T.wake = null; }
}
function releaseWake(){
  if(T.wake){ try{ T.wake.release(); }catch(e){} T.wake = null; }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && T.running) requestWake();
});

function pickPreset(s){
  stopTick();
  T.total = s; T.left = s; T.running = false;
  renderPresets(); paintTimer();
  startTimer();
}

function startTick(){
  T.endAt = Date.now() + T.left * 1000;
  T.running = true;
  requestWake();
  clearInterval(T.tick);
  T.tick = setInterval(()=>{
    T.left = (T.endAt - Date.now()) / 1000;
    if(T.left <= 0){
      T.left = 0;
      stopTick();
      buzz();
      toast('Time');
    }
    paintTimer();
  }, 200);
  paintTimer();
}
function stopTick(){
  clearInterval(T.tick); T.tick = null;
  T.running = false;
  releaseWake();
}
function startTimer(){
  if(!T.total) return toast('Pick a time first', true);
  if(T.left <= 0){ T.left = T.total; }
  startTick();
}
function buzz(){
  try{ if(navigator.vibrate) navigator.vibrate([220,110,220]); }catch(e){}
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    [0, 0.28].forEach(t=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.2);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.22);
    });
    setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, 900);
  }catch(e){}
}

function renderTimer(){
  renderPresets();
  paintTimer();
  const note = document.getElementById('wakeNote');
  note.textContent = ('wakeLock' in navigator)
    ? 'SCREEN STAYS AWAKE WHILE THE TIMER RUNS'
    : 'THIS BROWSER CAN\u2019T KEEP THE SCREEN AWAKE';
}

document.getElementById('tStart').onclick = ()=>{
  if(T.running){ stopTick(); paintTimer(); }
  else startTimer();
};
document.getElementById('tReset').onclick = ()=>{
  stopTick();
  T.left = T.total;
  paintTimer();
};

/* ---------- ACTIONS ---------- */
document.querySelectorAll('.tab').forEach(b=>{
  b.onclick = ()=>{
    const t = b.dataset.tab;
    if(t==='record') goHome();
    else if(t==='timer') goTimer();
    else if(t==='analyse') goAnalyse();
    else goSettings();
  };
});

document.getElementById('backBtn').onclick = ()=>{
  if(state.screen==='edit') goExercise(state.category, state.exercise);
  else if(state.screen==='exercise' || state.screen==='addex') goCategory(state.category);
  else if(state.screen==='category' || state.screen==='newsection') goHome();
  else if(state.screen==='manage'){ state.category ? goCategory(state.category) : goHome(); }
};
document.getElementById('manageBtn').onclick = goManage;

document.getElementById('addCatBtn').onclick = ()=>{
  const name = document.getElementById('newCatName').value.trim();
  const type = document.getElementById('newCatType').value;
  const color = document.getElementById('newCatColor').value;
  if(!name) return toast('Give it a name', true);
  const k = slug(name);
  if(!k) return toast('Use letters or numbers', true);
  if(CATEGORIES[k]) return toast('That section exists', true);
  CATEGORIES[k] = { label:name, type:type, color:color, exercises:[] };
  saveCategories(); toast('Section created'); goCategory(k);
};

document.getElementById('showAddExBtn').onclick = goAddEx;

document.getElementById('addExBtn').onclick = ()=>{
  const name = document.getElementById('newExName').value.trim();
  const type = document.getElementById('newExType').value;
  if(!name) return toast('Give it a name', true);
  const cat = CATEGORIES[state.category];
  if(cat.exercises.some(x=>x.name.toLowerCase()===name.toLowerCase()))
    return toast('Already on the list', true);
  cat.exercises.push({name:name, type:type});
  saveCategories(); toast('Exercise added'); goCategory(state.category);
};

document.getElementById('logBtn').onclick = function(){
  const c = state.category, n = state.exercise;
  const inputs = document.querySelectorAll('#fieldsHost input');
  const entry = { date:new Date().toISOString() };
  let missing = false, hasWeight = false;
  inputs.forEach(i=>{
    const v = i.value.trim();
    if(v==='') missing = true;
    entry[i.dataset.k] = v;
    if(i.dataset.unit) hasWeight = true;
  });
  if(missing) return toast('Fill in every field', true);
  if(hasWeight) entry.unit = PREFS.unit;
  const note = document.getElementById('inNote').value.trim();
  if(note) entry.note = note;

  const hist = getHistory(c,n);
  const today = new Date().toDateString();
  const same = hist[0] && new Date(hist[0].date).toDateString()===today;

  if(same) hist[0] = entry; else hist.unshift(entry);

  if(saveHistory(c,n,hist)){
    toast(same ? "Today's session updated" : 'Session logged');
    renderExercise();
  } else toast('Could not save', true);
};

document.getElementById('saveEditBtn').onclick = function(){
  const c = state.category, n = state.exercise, idx = state.editIdx;
  const hist = getHistory(c,n);
  const entry = hist[idx];
  if(!entry) return goExercise(c,n);

  const inputs = document.querySelectorAll('#editFieldsHost input');
  let missing = false, hasWeight = false;
  const updated = { date: entry.date };
  inputs.forEach(i=>{
    const v = i.value.trim();
    if(v==='') missing = true;
    updated[i.dataset.k] = v;
    if(i.dataset.unit) hasWeight = true;
  });
  if(missing) return toast('Fill in every field', true);
  if(hasWeight) updated.unit = PREFS.unit;
  const note = document.getElementById('editNote').value.trim();
  if(note) updated.note = note;

  hist[idx] = updated;
  if(saveHistory(c,n,hist)){
    toast('Entry updated');
    goExercise(c,n);
  } else toast('Could not save', true);
};

document.getElementById('delEntryBtn').onclick = function(){
  const c = state.category, n = state.exercise, idx = state.editIdx;
  const hist = getHistory(c,n);
  if(!hist[idx]) return goExercise(c,n);
  if(!confirm('Delete this entry permanently?')) return;
  hist.splice(idx,1);
  if(saveHistory(c,n,hist)){
    toast('Entry deleted');
    goExercise(c,n);
  } else toast('Could not delete', true);
};

loadPrefs();
loadCategories();
goHome();
